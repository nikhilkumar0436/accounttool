version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: accounttool-postgres
    environment:
      POSTGRES_DB: accounttool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - accounttool-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accounttool-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accounttool
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - accounttool-network
    restart: unless-stopped

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: accounttool-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - accounttool-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  accounttool-network:
    driver: bridge
